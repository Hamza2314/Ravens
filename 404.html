<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 404 pages can be shown at any URL depth, so resolve every path from the site root -->
  <base href="/">
  <title>Page not found | Ravens Accessories</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<body data-page="404" data-title="Page not found">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="./">
        <img class="brand__logo" src="images/logo-light.svg" alt="" width="40" height="40" data-logo>
        <span class="brand__name" data-cfg="brand.name">Ravens Accessories</span>
      </a>
    </div>
  </header>

  <main id="main" class="centered-page">
    <div class="container centered-page__inner">
      <img class="centered-page__logo" src="images/logo-light.svg" alt="" width="84" height="84" data-logo>
      <p class="eyebrow">Error 404</p>
      <h1 class="section__title" data-cfg="notFound.title">This page flew away</h1>
      <div class="ornament" aria-hidden="true"><span></span></div>
      <p data-cfg="notFound.message">The page you are looking for doesn't exist or has moved.</p>
      <a class="btn btn--buy" href="./" data-cfg="notFound.button">Back to the shop</a>
    </div>
  </main>

  <footer class="site-footer site-footer--plain">
    <div class="container">
      <div class="footer__bottom">
        <p><a href="legal-notice.html">Legal notice</a> · <a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms</a></p>
        <p>© <span data-var="year"></span> <span data-cfg="brand.name">Ravens Accessories</span></p>
      </div>
    </div>
  </footer>
</body>
</html>
